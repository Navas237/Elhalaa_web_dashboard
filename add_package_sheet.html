<div style="min-height:480px; background:rgba(26,29,46,0.5); display:flex; align-items:flex-end; justify-content:center; padding:0;">
  <div style="background:#fff; border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:380px;">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <p style="font-size:16px; font-weight:500; color:#1A1D2E; margin:0;">إضافة باقة جديدة</p>
      <i class="ti ti-x" style="font-size:20px; color:#5A5F6B; cursor:pointer;" aria-hidden="true"></i>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">

      <div>
        <p style="font-size:12px; color:#9EA3AE; margin:0 0 6px;">اسم الباقة</p>
        <input type="text" placeholder="مثال: قص + لحية" style="width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:0.5px solid #E2E4E8; font-size:14px; color:#1A1D2E; background:#F7F8FA;" />
      </div>

      <div>
        <p style="font-size:12px; color:#9EA3AE; margin:0 0 6px;">الوصف (اختياري)</p>
        <textarea placeholder="وصف قصير للباقة يظهر للعميل" rows="3" style="width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:0.5px solid #E2E4E8; font-size:13px; color:#1A1D2E; background:#F7F8FA; resize:none; font-family:inherit;"></textarea>
      </div>

      <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;">
        <div>
          <p style="font-size:12px; color:#9EA3AE; margin:0 0 6px;">السعر</p>
          <div style="display:flex; align-items:center; border-radius:8px; border:0.5px solid #E2E4E8; background:#F7F8FA; padding:0 12px;">
            <input type="number" placeholder="150" style="flex:1; min-width:0; border:none; background:transparent; padding:10px 0; font-size:14px; color:#1A1D2E; outline:none;" />
            <span style="font-size:12px; color:#9EA3AE;">جنيه</span>
          </div>
        </div>
        <div>
          <p style="font-size:12px; color:#9EA3AE; margin:0 0 6px;">المدة</p>
          <div style="display:flex; align-items:center; border-radius:8px; border:0.5px solid #E2E4E8; background:#F7F8FA; padding:0 12px;">
            <input type="number" placeholder="45" style="flex:1; min-width:0; border:none; background:transparent; padding:10px 0; font-size:14px; color:#1A1D2E; outline:none;" />
            <span style="font-size:12px; color:#9EA3AE;">دقيقة</span>
          </div>
        </div>
      </div>

      <div style="background:#E8F8F7; border:0.5px solid #5EC8C0; border-radius:8px; padding:9px 11px; margin-top:2px;">
        <p style="font-size:11px; color:#2FA8A0; margin:0;">
          <i class="ti ti-info-circle" style="font-size:12px;" aria-hidden="true"></i>
          الباقة هتظهر فوراً في خطوة اختيار الباقة عند إنشاء حجز جديد
        </p>
      </div>

      <button style="width:100%; padding:13px; border-radius:10px; background:#E8192C; color:#fff; border:none; font-size:14px; font-weight:500; cursor:pointer; margin-top:6px;">
        حفظ الباقة
      </button>
    </div>

  </div>
</div>
