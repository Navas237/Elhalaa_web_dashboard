
<div style="max-width:380px; margin:0 auto; background:#F7F8FA; min-height:100vh; display:flex; flex-direction:column; font-family:var(--font-sans); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); overflow:hidden;">

  <div style="background:#fff; padding:16px; display:flex; align-items:center; gap:12px; border-bottom:0.5px solid #E2E4E8;">
    <i class="ti ti-arrow-right" style="font-size:20px; color:#5A5F6B;" aria-hidden="true"></i>
    <p style="font-size:18px; font-weight:500; color:#1A1D2E; margin:0;">الجداول وساعات العمل</p>
  </div>

  <div style="background:#fff; padding:6px; margin:12px 16px 0; border-radius:10px; border:0.5px solid #E2E4E8; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:4px;">
    <button id="tab-shop" onclick="switchTab('shop')" style="padding:8px; border-radius:8px; border:none; background:#E8192C; color:#fff; font-size:13px; font-weight:500; cursor:pointer;">ساعات الفرع</button>
    <button id="tab-staff" onclick="switchTab('staff')" style="padding:8px; border-radius:8px; border:none; background:transparent; color:#5A5F6B; font-size:13px; cursor:pointer;">جداول الحلاقين</button>
  </div>

  <div id="view-shop" style="padding:16px; display:flex; flex-direction:column; gap:10px;">
    <div style="background:#E8F8F7; border:0.5px solid #5EC8C0; border-radius:10px; padding:10px 12px;">
      <p style="font-size:12px; color:#2FA8A0; margin:0;">
        <i class="ti ti-info-circle" style="font-size:13px;" aria-hidden="true"></i>
        ساعات الفرع هي الـ Default لكل الحلاقين — تقدر تعدل على أي حلاق بشكل منفصل من تبويب جداول الحلاقين
      </p>
    </div>

    <div id="shop-days"></div>

    <button style="width:100%; padding:12px; border-radius:10px; background:#E8192C; color:#fff; border:none; font-size:14px; font-weight:500; cursor:pointer; margin-top:4px;">
      حفظ ساعات الفرع
    </button>
  </div>

  <div id="view-staff" style="padding:16px; display:none; flex-direction:column; gap:10px;">

    <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;">
      <div id="barber-كريم" onclick="selectBarber('كريم')" style="text-align:center; min-width:56px; cursor:pointer;">
        <div style="width:44px; height:44px; border-radius:50%; background:#FDECEA; border:2px solid #E8192C; display:flex; align-items:center; justify-content:center; font-size:13px; color:#E8192C; margin:0 auto 4px;">كر</div>
        <p style="font-size:11px; color:#E8192C; font-weight:500; margin:0;">كريم</p>
      </div>
      <div id="barber-سامي" onclick="selectBarber('سامي')" style="text-align:center; min-width:56px; cursor:pointer;">
        <div style="width:44px; height:44px; border-radius:50%; background:#F0F1F3; border:2px solid #E2E4E8; display:flex; align-items:center; justify-content:center; font-size:13px; color:#9EA3AE; margin:0 auto 4px;">سا</div>
        <p style="font-size:11px; color:#9EA3AE; margin:0;">سامي</p>
      </div>
      <div id="barber-مازن" onclick="selectBarber('مازن')" style="text-align:center; min-width:56px; cursor:pointer;">
        <div style="width:44px; height:44px; border-radius:50%; background:#F0F1F3; border:2px solid #E2E4E8; display:flex; align-items:center; justify-content:center; font-size:13px; color:#9EA3AE; margin:0 auto 4px;">ما</div>
        <p style="font-size:11px; color:#9EA3AE; margin:0;">مازن</p>
      </div>
      <div id="barber-علي" onclick="selectBarber('علي')" style="text-align:center; min-width:56px; cursor:pointer;">
        <div style="width:44px; height:44px; border-radius:50%; background:#F0F1F3; border:2px solid #E2E4E8; display:flex; align-items:center; justify-content:center; font-size:13px; color:#9EA3AE; margin:0 auto 4px;">عل</div>
        <p style="font-size:11px; color:#9EA3AE; margin:0;">علي</p>
      </div>
    </div>

    <div id="staff-days" style="display:flex; flex-direction:column; gap:10px;"></div>

    <button style="width:100%; padding:12px; border-radius:10px; background:#E8192C; color:#fff; border:none; font-size:14px; font-weight:500; cursor:pointer;">
      حفظ جدول الحلاق
    </button>
  </div>

  <div style="margin-top:auto; background:#fff; border-top:0.5px solid #E2E4E8; padding:10px 0 6px; display:grid; grid-template-columns:repeat(4, 1fr);">
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
      <i class="ti ti-home" style="font-size:22px; color:#9EA3AE;" aria-hidden="true"></i>
      <span style="font-size:10px; color:#9EA3AE;">الرئيسية</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
      <i class="ti ti-calendar" style="font-size:22px; color:#9EA3AE;" aria-hidden="true"></i>
      <span style="font-size:10px; color:#9EA3AE;">الحجوزات</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
      <i class="ti ti-layout-grid" style="font-size:22px; color:#E8192C;" aria-hidden="true"></i>
      <span style="font-size:10px; color:#E8192C; font-weight:500;">إدارة</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
      <i class="ti ti-settings" style="font-size:22px; color:#9EA3AE;" aria-hidden="true"></i>
      <span style="font-size:10px; color:#9EA3AE;">الإعدادات</span>
    </div>
  </div>
</div>

<script>
const days = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

const shopHours = [
  {day:'السبت',  on:true,  start:'09:00', end:'18:00'},
  {day:'الأحد',  on:true,  start:'09:00', end:'18:00'},
  {day:'الاثنين',on:true,  start:'09:00', end:'18:00'},
  {day:'الثلاثاء',on:true, start:'09:00', end:'18:00'},
  {day:'الأربعاء',on:true, start:'09:00', end:'18:00'},
  {day:'الخميس', on:true,  start:'09:00', end:'18:00'},
  {day:'الجمعة', on:false, start:'',      end:''},
];

const staffHours = {
  'كريم': [
    {day:'السبت',  on:true,  start:'10:00', end:'17:00', custom:true},
    {day:'الأحد',  on:true,  start:'09:00', end:'18:00', custom:false},
    {day:'الاثنين',on:false, start:'',      end:'',      custom:true, label:'إجازة'},
    {day:'الثلاثاء',on:true, start:'09:00', end:'18:00', custom:false},
    {day:'الأربعاء',on:true, start:'12:00', end:'18:00', custom:true},
    {day:'الخميس', on:true,  start:'09:00', end:'18:00', custom:false},
    {day:'الجمعة', on:false, start:'',      end:'',      custom:false},
  ],
  'سامي': shopHours.map(d => ({...d, custom:false})),
  'مازن': shopHours.map(d => ({...d, custom:false})),
  'علي':  shopHours.map(d => ({...d, custom:false})),
};

let currentBarber = 'كريم';

function renderShopDays() {
  const container = document.getElementById('shop-days');
  container.innerHTML = shopHours.map((d,i) => `
    <div style="background:#fff; border-radius:12px; border:0.5px solid #E2E4E8; padding:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:${d.on?'12px':'0'};">
        <p style="font-size:14px; font-weight:500; color:#1A1D2E; margin:0;">${d.day}</p>
        <div onclick="toggleShopDay(${i})" style="width:40px; height:22px; border-radius:11px; background:${d.on?'#E8192C':'#E2E4E8'}; position:relative; cursor:pointer; transition:background 0.2s;">
          <div style="position:absolute; top:3px; ${d.on?'right:3px':'left:3px'}; width:16px; height:16px; border-radius:50%; background:#fff;"></div>
        </div>
      </div>
      ${d.on ? `
      <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;">
        <div style="background:#F7F8FA; border-radius:8px; padding:10px;">
          <p style="font-size:11px; color:#9EA3AE; margin:0 0 4px;">من</p>
          <p style="font-size:14px; font-weight:500; color:#1A1D2E; margin:0;">${d.start}</p>
        </div>
        <div style="background:#F7F8FA; border-radius:8px; padding:10px;">
          <p style="font-size:11px; color:#9EA3AE; margin:0 0 4px;">إلى</p>
          <p style="font-size:14px; font-weight:500; color:#1A1D2E; margin:0;">${d.end}</p>
        </div>
      </div>` : `<p style="font-size:12px; color:#9EA3AE; margin:0;">إجازة</p>`}
    </div>
  `).join('');
}

function toggleShopDay(i) {
  shopHours[i].on = !shopHours[i].on;
  if(shopHours[i].on) { shopHours[i].start='09:00'; shopHours[i].end='18:00'; }
  else { shopHours[i].start=''; shopHours[i].end=''; }
  renderShopDays();
}

function renderStaffDays() {
  const hours = staffHours[currentBarber];
  const container = document.getElementById('staff-days');
  container.innerHTML = hours.map((d,i) => `
    <div style="background:#fff; border-radius:12px; border:0.5px solid ${d.custom?'#E8192C':'#E2E4E8'}; padding:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:${d.on?'12px':'0'};">
        <div style="display:flex; align-items:center; gap:8px;">
          <p style="font-size:14px; font-weight:500; color:#1A1D2E; margin:0;">${d.day}</p>
          ${d.custom ? `<span style="font-size:10px; background:#FDECEA; color:#E8192C; padding:2px 7px; border-radius:4px;">مختلف عن الفرع</span>` : `<span style="font-size:10px; background:#F0F1F3; color:#9EA3AE; padding:2px 7px; border-radius:4px;">مثل الفرع</span>`}
        </div>
        <div onclick="toggleStaffDay(${i})" style="width:40px; height:22px; border-radius:11px; background:${d.on?'#E8192C':'#E2E4E8'}; position:relative; cursor:pointer;">
          <div style="position:absolute; top:3px; ${d.on?'right:3px':'left:3px'}; width:16px; height:16px; border-radius:50%; background:#fff;"></div>
        </div>
      </div>
      ${d.on ? `
      <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;">
        <div style="background:#F7F8FA; border-radius:8px; padding:10px;">
          <p style="font-size:11px; color:#9EA3AE; margin:0 0 4px;">من</p>
          <p style="font-size:14px; font-weight:500; color:#1A1D2E; margin:0;">${d.start}</p>
        </div>
        <div style="background:#F7F8FA; border-radius:8px; padding:10px;">
          <p style="font-size:11px; color:#9EA3AE; margin:0 0 4px;">إلى</p>
          <p style="font-size:14px; font-weight:500; color:#1A1D2E; margin:0;">${d.end}</p>
        </div>
      </div>` : `<p style="font-size:12px; color:#9EA3AE; margin:0;">${d.label||'إجازة'}</p>`}
    </div>
  `).join('');
}

function toggleStaffDay(i) {
  const d = staffHours[currentBarber][i];
  d.on = !d.on;
  d.custom = true;
  if(d.on) { d.start='09:00'; d.end='18:00'; } else { d.start=''; d.end=''; }
  renderStaffDays();
}

function selectBarber(name) {
  currentBarber = name;
  ['كريم','سامي','مازن','علي'].forEach(b => {
    const el = document.getElementById('barber-'+b);
    if(!el) return;
    const circle = el.querySelector('div');
    const label = el.querySelector('p');
    if(b === name) {
      circle.style.background='#FDECEA'; circle.style.borderColor='#E8192C'; circle.style.color='#E8192C';
      label.style.color='#E8192C'; label.style.fontWeight='500';
    } else {
      circle.style.background='#F0F1F3'; circle.style.borderColor='#E2E4E8'; circle.style.color='#9EA3AE';
      label.style.color='#9EA3AE'; label.style.fontWeight='400';
    }
  });
  renderStaffDays();
}

function switchTab(tab) {
  const isShop = tab === 'shop';
  document.getElementById('view-shop').style.display = isShop ? 'flex' : 'none';
  document.getElementById('view-staff').style.display = isShop ? 'none' : 'flex';
  document.getElementById('tab-shop').style.background = isShop ? '#E8192C' : 'transparent';
  document.getElementById('tab-shop').style.color = isShop ? '#fff' : '#5A5F6B';
  document.getElementById('tab-staff').style.background = isShop ? 'transparent' : '#E8192C';
  document.getElementById('tab-staff').style.color = isShop ? '#5A5F6B' : '#fff';
}

renderShopDays();
renderStaffDays();
</script>
